<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOXIS — Gestão de Documentos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;font-family:'DM Sans',sans-serif;color:#EDEBE8;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
input,select{background:#1E1E1E;border:1px solid #2C2C2C;border-radius:8px;color:#EDEBE8;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 13px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:#F97316}
input::placeholder{color:#3A3A3A}
select option{background:#1E1E1E}
.fl{display:block;font-size:11px;font-weight:600;color:#555;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:5px}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none}
@keyframes fU{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fI{from{opacity:0}to{opacity:1}}
@keyframes sI{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes tI{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fu{animation:fU .3s ease forwards}
.si{animation:sI .2s ease}
#toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;display:none;animation:tI .25s ease;box-shadow:0 8px 28px rgba(0,0,0,.5);color:#fff}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fI .2s ease}
.bp{background:#F97316;color:#080808;font-weight:600;border-radius:8px;transition:background .15s}
.bp:hover:not(:disabled){background:#EA580C}
.bp:disabled{opacity:.5;cursor:not-allowed}
.bg{background:transparent;border:1px solid #2C2C2C;color:#EDEBE8;font-weight:500;border-radius:8px}
.bg:hover{border-color:#555}
.bd{background:transparent;border:1px solid rgba(239,68,68,.35);color:#EF4444;font-weight:500;border-radius:8px}
.nt{background:transparent;border-bottom:2px solid transparent;font-size:14px;padding:13px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px;color:#666}
.nt.on{border-bottom-color:#F97316;color:#EDEBE8;font-weight:600}
.nt:hover:not(.on){color:#999}
.sc{background:#161616;border:1px solid #2C2C2C;border-radius:12px;padding:22px;flex:1;transition:border-color .2s}
.sc:hover{border-color:#F97316}
tr{transition:background .1s}
@media(max-width:700px){
  #app>div>div{padding-left:16px!important;padding-right:16px!important}
  .nt{padding:12px 9px;font-size:12px;white-space:nowrap}
  #app table{min-width:580px}
  #app [style*="grid-template-columns:1fr 1fr 1fr auto"]{grid-template-columns:1fr!important}
  #app [style*="max-width:980px"]{overflow-x:auto}
  #app [style*="display:flex;padding:0 40px"]{overflow-x:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script src="config.js"></script>
<script src="security.js"></script>
<script src="app.js"></script>

</body>
</html>
