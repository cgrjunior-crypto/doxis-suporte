<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOXIS — Gestão de Documentos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;font-family:'DM Sans',sans-serif;color:#EDEBE8;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
input,select{background:#1E1E1E;border:1px solid #2C2C2C;border-radius:8px;color:#EDEBE8;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 13px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:#F97316}
input::placeholder{color:#3A3A3A}
select option{background:#1E1E1E}
.fl{display:block;font-size:11px;font-weight:600;color:#555;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:5px}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none}
@keyframes fU{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fI{from{opacity:0}to{opacity:1}}
@keyframes sI{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes tI{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fu{animation:fU .3s ease forwards}
.si{animation:sI .2s ease}
#toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;display:none;animation:tI .25s ease;box-shadow:0 8px 28px rgba(0,0,0,.5);color:#fff}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fI .2s ease}
.bp{background:#F97316;color:#080808;font-weight:600;border-radius:8px;transition:background .15s}
.bp:hover:not(:disabled){background:#EA580C}
.bp:disabled{opacity:.5;cursor:not-allowed}
.bg{background:transparent;border:1px solid #2C2C2C;color:#EDEBE8;font-weight:500;border-radius:8px}
.bg:hover{border-color:#555}
.bd{background:transparent;border:1px solid rgba(239,68,68,.35);color:#EF4444;font-weight:500;border-radius:8px}
.nt{background:transparent;border-bottom:2px solid transparent;font-size:14px;padding:13px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px;color:#666}
.nt.on{border-bottom-color:#F97316;color:#EDEBE8;font-weight:600}
.nt:hover:not(.on){color:#999}
.sc{background:#161616;border:1px solid #2C2C2C;border-radius:12px;padding:22px;flex:1;transition:border-color .2s}
.sc:hover{border-color:#F97316}
tr{transition:background .1s}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
// ════════════════════════════════════════════════
//  ⚙️  CONFIGURAÇÃO — edite apenas estas 2 linhas
// ════════════════════════════════════════════════
const SUPABASE_URL = 'https://drjcxeldjxsmbmnacski.supabase.co/rest/v1/'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyamN4ZWxkanhzbWJtbmFjc2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODE1MjMsImV4cCI6MjA5NTU1NzUyM30.nLv-rTnctlR7RwlfqvdfPqA6nHGHuXi5SST-HrEtUVI'
// ════════════════════════════════════════════════

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

// ── Cores ──
const O='#F97316',OD='#EA580C',BK='#080808',S1='#0F0F0F',S2='#161616',S3='#1E1E1E',S4='#262626',BR='#2C2C2C',TX='#EDEBE8',MU='#666',DG='#EF4444',GR='#22C55E'
const FD="'Barlow Condensed',sans-serif"

// ── Estado da aplicação ──
let A = {
  v:'loading',       // view atual
  profile:null,      // {id, cpf, name, role}
  docs:[],           // documentos
  emps:[],           // colaboradores (admin)
  aT:'overview',     // aba admin
  fC:'all',          // filtro por CPF
  sd:null,           // doc selecionado (viewer)
  bUrl:null,         // URL assinada do PDF
}

// ── Sessão simples via localStorage ──
function saveSession(p){ localStorage.setItem('doxis_s', JSON.stringify(p)) }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('doxis_s')) }catch{ return null } }
function clearSession(){ localStorage.removeItem('doxis_s') }

// ── Toast ──
function tos(m,t='ok'){
  const e=document.getElementById('toast')
  e.textContent=m; e.style.display='block'
  e.style.background=t==='err'?DG:t==='wa'?'#F59E0B':GR
  clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3200)
}

// ── Modal ──
function cMo(){ document.getElementById('modal').innerHTML='' }

// ── Utilitários ──
const fC=v=>{const d=v.replace(/\D/g,'').slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
const rC=v=>v.replace(/\D/g,'')
const fSz=b=>b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'
const fDt=s=>s?new Date(s).toLocaleDateString('pt-BR'):'—'
const ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const av=(n,z=34)=>`<div style="width:${z}px;height:${z}px;background:${O};border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:${FD};font-weight:700;font-size:${Math.round(z*.38)}px;color:${BK};flex-shrink:0">${ini(n)}</div>`
const lg=big=>`<div style="display:flex;align-items:center;gap:10px"><div style="width:${big?35:23}px;height:${big?48:32}px;background:${O};border-radius:3px 10px 3px 3px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-family:${FD};font-weight:800;font-size:${big?26:17}px;color:${BK};line-height:1">D</span></div><span style="font-family:${FD};font-weight:700;font-size:${big?40:24}px;color:${TX};letter-spacing:5px;line-height:1">OXIS</span></div>`
const nv=()=>`<div style="height:60px;background:${S1};border-bottom:1px solid ${BR};display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex-shrink:0">${lg(false)}<div style="display:flex;align-items:center;gap:10px"><button onclick="A.v='profile';R()" style="display:flex;align-items:center;gap:9px;background:${S3};border:1px solid ${BR};border-radius:8px;padding:6px 14px 6px 8px;transition:border-color .2s" onmouseover="this.style.borderColor='${O}'" onmouseout="this.style.borderColor='${BR}'">${av(A.profile.name,30)}<div style="text-align:left"><div style="font-size:13px;font-weight:600;color:${TX}">${A.profile.name}</div><div style="font-size:11px;color:${MU}">${A.profile.role==='admin'?'Administrador':'Colaborador'}</div></div></button><button onclick="lo()" class="bg" style="padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:5px"><i class="ti ti-logout" style="font-size:14px"></i>Sair</button></div></div>`

// ── Card de documento ──
function cd(d,del){
  return `<div style="background:${S2};border:1px solid ${BR};border-radius:12px;overflow:hidden;transition:all .2s" onmouseover="this.style.borderColor='${O}';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='${BR}';this.style.transform='translateY(0)'">
    <div style="height:3px;background:linear-gradient(90deg,${O},${OD})"></div>
    <div style="padding:16px 18px 14px">
      <div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:13px">
        <div style="width:36px;height:44px;background:${O}14;border:1px solid ${O}28;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-file-type-pdf" style="font-size:18px;color:${O}"></i></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;color:${TX};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</div>
          <div style="font-size:12px;color:${MU};margin-top:3px"><i class="ti ti-calendar" style="font-size:11px"></i> ${fDt(d.uploaded_at)} · ${fSz(d.size||0)}</div>
        </div>
      </div>
      <div style="display:flex;gap:7px">
        <button onclick="oV('${d.id}')" class="bp" style="flex:1;padding:8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px"><i class="ti ti-eye" style="font-size:13px"></i>Visualizar</button>
        <button onclick="dlD('${d.id}')" class="bg" style="flex:1;padding:8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px"><i class="ti ti-download" style="font-size:13px"></i>Download</button>
        ${del?`<button onclick="ddD('${d.id}','${d.storage_path}')" class="bd" style="padding:8px 10px;font-size:13px"><i class="ti ti-trash" style="font-size:14px"></i></button>`:''}
      </div>
    </div>
  </div>`
}

// ════════════════════════════════════════════════
//  VIEWS
// ════════════════════════════════════════════════

function vLoad(){
  return `<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:${BK}"><div style="text-align:center"><div style="font-family:${FD};font-size:40px;color:${O};letter-spacing:5px;margin-bottom:20px">DOXIS</div><div style="width:32px;height:32px;border:3px solid ${BR};border-top-color:${O};border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div><div style="font-size:13px;color:${MU};margin-top:16px">Conectando...</div></div></div>`
}

function vLg(){
  return `<div style="min-height:100vh;background:${BK};display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden">
    <div style="position:fixed;top:-180px;right:-180px;width:500px;height:500px;background:${O};opacity:.04;border-radius:50%;pointer-events:none"></div>
    <div class="fu" style="width:100%;max-width:420px">
      <div style="background:${S1};border:1px solid ${BR};border-radius:16px;padding:42px">
        <div style="display:flex;justify-content:center;margin-bottom:10px">${lg(true)}</div>
        <p style="text-align:center;font-family:${FD};font-size:12px;color:${MU};letter-spacing:2px;margin-bottom:36px;text-transform:uppercase">Gestão Segura de Documentos</p>
        <div style="display:flex;flex-direction:column;gap:15px">
          <div><label class="fl">CPF</label><input id="lc" placeholder="000.000.000-00" oninput="this.value=fC(this.value)" onkeydown="if(event.key==='Enter')dL()"></div>
          <div><label class="fl">Senha</label><input id="lp" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')dL()"></div>
          <div id="le" style="font-size:13px;color:${DG};text-align:center;display:none"></div>
          <button id="lbtn" class="bp" onclick="dL()" style="padding:13px;font-size:15px;width:100%;margin-top:4px">Entrar</button>
          <p style="text-align:center;font-size:12px;color:${MU}">Esqueceu a senha? Fale com o administrador.</p>
        </div>
        <p style="font-size:11px;color:#1E1E1E;text-align:center;margin-top:28px">DOXIS v1.1 · © 2025 · Powered by Supabase</p>
      </div>
    </div>
  </div>`
}

function vDs(){
  return `<div style="height:100vh;display:flex;flex-direction:column;background:${BK}">
    ${nv()}
    <div style="background:linear-gradient(135deg,${S1},${S2});border-bottom:1px solid ${BR};padding:24px 40px">
      <div style="max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between">
        <div><h1 style="font-family:${FD};font-weight:700;font-size:32px;color:${TX}">Meus Documentos</h1><p style="font-size:13px;color:${MU};margin-top:2px">${A.docs.length} documento${A.docs.length!==1?'s':''} disponível${A.docs.length!==1?'is':''}</p></div>
        <div style="background:${S3};border:1px solid ${BR};border-radius:10px;padding:12px 18px;text-align:center"><div style="font-family:${FD};font-size:30px;font-weight:700;color:${O};line-height:1">${A.docs.length}</div><div style="font-size:11px;color:${MU};text-transform:uppercase;letter-spacing:1px;margin-top:2px">Total</div></div>
      </div>
    </div>
    <div style="flex:1;overflow:auto;padding:28px 40px">
      <div style="max-width:880px;margin:0 auto">
        ${A.docs.length===0
          ?`<div style="text-align:center;padding:72px 0"><div style="width:68px;height:68px;background:${S3};border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px"><i class="ti ti-file-off" style="font-size:30px;color:${MU}"></i></div><p style="font-size:15px;color:${MU};margin-bottom:5px">Nenhum documento disponível</p><p style="font-size:13px;color:#2C2C2C">Seus documentos aparecerão aqui quando enviados pelo RH</p></div>`
          :`<div class="fu" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px">${A.docs.map(d=>cd(d,false)).join('')}</div>`
        }
      </div>
    </div>
  </div>`
}

function vVw(){
  const d=A.sd,bk=A.profile.role==='admin'?'admin':'dashboard'
  return `<div style="height:100vh;display:flex;flex-direction:column;background:${BK}">
    ${nv()}
    <div style="display:flex;align-items:center;gap:12px;padding:9px 32px;background:${S1};border-bottom:1px solid ${BR}">
      <button onclick="A.v='${bk}';R()" style="background:transparent;color:${MU};font-size:14px;display:flex;align-items:center;gap:5px"><i class="ti ti-arrow-left" style="font-size:15px"></i>Voltar</button>
      <span style="color:${BR}">|</span>
      <i class="ti ti-file-type-pdf" style="font-size:15px;color:${O}"></i>
      <span style="font-size:14px;color:${TX};font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</span>
      <span style="font-size:12px;color:${MU};white-space:nowrap">${fDt(d.uploaded_at)}</span>
      <button onclick="dlD('${d.id}')" class="bg" style="padding:6px 13px;font-size:13px;display:flex;align-items:center;gap:5px"><i class="ti ti-download" style="font-size:13px"></i>Download</button>
    </div>
    <div style="flex:1;overflow:hidden;background:${S1}"><iframe src="${A.bUrl}" style="width:100%;height:100%;border:none" title="${d.name}"></iframe></div>
  </div>`
}

function vPf(){
  const p=A.profile,bk=p.role==='admin'?'admin':'dashboard'
  return `<div style="height:100vh;display:flex;flex-direction:column;background:${BK}">
    ${nv()}
    <div style="flex:1;overflow:auto;padding:38px">
      <div style="max-width:560px;margin:0 auto">
        <button onclick="A.v='${bk}';R()" style="background:transparent;color:${MU};font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:26px;padding:0"><i class="ti ti-arrow-left" style="font-size:15px"></i>Voltar</button>
        <div class="fu" style="background:${S2};border:1px solid ${BR};border-radius:14px;padding:28px;margin-bottom:18px">
          <div style="display:flex;align-items:center;gap:18px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid ${BR}">
            <div style="width:66px;height:66px;background:${O};border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:${FD};font-weight:700;font-size:24px;color:${BK};flex-shrink:0">${ini(p.name)}</div>
            <div><div style="font-family:${FD};font-weight:700;font-size:26px;color:${TX}">${p.name}</div><div style="font-size:13px;color:${MU};margin-top:2px">${p.role==='admin'?'Administrador':'Colaborador'}</div></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
            <div style="background:${S3};border-radius:8px;padding:13px"><div style="font-size:11px;color:${MU};letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">CPF</div><div style="font-size:14px;color:${TX};font-weight:500">${fC(p.cpf)}</div></div>
            <div style="background:${S3};border-radius:8px;padding:13px"><div style="font-size:11px;color:${MU};letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${p.role==='admin'?'Acesso':'Documentos'}</div><div style="font-size:14px;color:${O};font-weight:600">${p.role==='admin'?'Administrador':A.docs.length+' arquivo'+(A.docs.length!==1?'s':'')}</div></div>
          </div>
        </div>
        <div class="fu" style="background:${S2};border:1px solid ${BR};border-radius:14px;padding:28px">
          <h3 style="font-family:${FD};font-size:21px;font-weight:700;color:${TX};margin-bottom:5px;display:flex;align-items:center;gap:8px"><i class="ti ti-lock" style="font-size:18px;color:${O}"></i>Alterar Senha</h3>
          <p style="font-size:13px;color:${MU};margin-bottom:20px">Recomendamos trocar a senha periodicamente.</p>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div><label class="fl">Senha atual</label><input id="pc" type="password" placeholder="••••••••"></div>
            <div><label class="fl">Nova senha</label><input id="p1" type="password" placeholder="Mínimo 8 caracteres"></div>
            <div><label class="fl">Confirmar nova senha</label><input id="p2" type="password" onkeydown="if(event.key==='Enter')chP()"></div>
            <div id="pEr" style="font-size:13px;color:${DG};display:none"></div>
            <div id="pOk" style="font-size:13px;color:${GR};display:none"></div>
            <button id="chpBtn" class="bp" onclick="chP()" style="padding:12px;font-size:14px;width:100%"><i class="ti ti-shield-check" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>Salvar Nova Senha</button>
          </div>
        </div>
      </div>
    </div>
  </div>`
}

function vAd(){
  const tabs=[['overview','Visão Geral','ti-layout-dashboard'],['docs','Documentos','ti-files'],['employees','Colaboradores','ti-users'],['upload','Enviar Documento','ti-upload']]
  const fDs=A.fC==='all'?A.docs:A.docs.filter(d=>d.user_cpf===A.fC)
  let ct=''

  if(A.aT==='overview'){
    const rec=[...A.docs].sort((a,b)=>new Date(b.uploaded_at)-new Date(a.uploaded_at)).slice(0,5)
    const now=new Date()
    const thisMo=A.docs.filter(d=>{const dt=new Date(d.uploaded_at);return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear()}).length
    const sts=[{i:'ti-users',l:'Colaboradores',v:A.emps.length,c:O},{i:'ti-files',l:'Documentos',v:A.docs.length,c:'#60A5FA'},{i:'ti-calendar-stats',l:'Este mês',v:thisMo,c:GR}]
    ct=`<div class="si"><h2 style="font-family:${FD};font-weight:700;font-size:28px;color:${TX};margin-bottom:20px">Visão Geral</h2>
    <div style="display:flex;gap:14px;margin-bottom:24px">${sts.map(s=>`<div class="sc"><div style="width:40px;height:40px;background:${s.c}18;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px"><i class="ti ${s.i}" style="font-size:20px;color:${s.c}"></i></div><div style="font-family:${FD};font-size:38px;font-weight:700;color:${TX};line-height:1">${s.v}</div><div style="font-size:13px;color:${MU};margin-top:4px">${s.l}</div></div>`).join('')}</div>
    <div style="background:${S2};border:1px solid ${BR};border-radius:12px;overflow:hidden">
      <div style="padding:16px 20px;border-bottom:1px solid ${BR};display:flex;align-items:center;justify-content:space-between"><h3 style="font-family:${FD};font-size:20px;font-weight:600;color:${TX}">Documentos Recentes</h3><button onclick="A.aT='docs';R()" style="background:transparent;color:${O};font-size:13px;font-weight:500">Ver todos →</button></div>
      ${rec.length===0?`<div style="padding:32px;text-align:center;color:${MU}">Nenhum documento ainda. Envie o primeiro pelo menu <strong style="color:${TX}">Enviar Documento</strong>.</div>`:`
      <table style="width:100%;border-collapse:collapse"><tbody>${rec.map(d=>{const e=A.emps.find(x=>x.cpf===d.user_cpf);return`<tr style="border-bottom:1px solid ${S4}" onmouseover="this.style.background='${S3}'" onmouseout="this.style.background='transparent'"><td style="padding:11px 20px"><div style="display:flex;align-items:center;gap:9px"><div style="width:30px;height:36px;background:${O}14;border:1px solid ${O}22;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-file-type-pdf" style="font-size:14px;color:${O}"></i></div><div><div style="font-size:14px;color:${TX};font-weight:500">${d.name}</div><div style="font-size:12px;color:${MU}">${e?e.name:fC(d.user_cpf)}</div></div></div></td><td style="padding:11px 20px;font-size:13px;color:${MU};text-align:right;white-space:nowrap">${fDt(d.uploaded_at)}</td><td style="padding:11px 20px;text-align:right"><button onclick="oV('${d.id}')" style="background:transparent;color:${O};font-size:13px;font-weight:500">Ver →</button></td></tr>`}).join('')}</tbody></table>`}
    </div></div>`
  }

  if(A.aT==='docs'){
    const rows=fDs.length===0?`<tr><td colspan="5" style="padding:36px;text-align:center;color:${MU}">Nenhum documento encontrado.</td></tr>`:fDs.map(d=>{const e=A.emps.find(x=>x.cpf===d.user_cpf);return`<tr style="border-bottom:1px solid ${S4}" onmouseover="this.style.background='${S3}'" onmouseout="this.style.background='transparent'"><td style="padding:11px 12px"><div style="font-size:13px;color:${TX};font-weight:500">${e?e.name:d.user_cpf}</div><div style="font-size:11px;color:${MU}">${fC(d.user_cpf)}</div></td><td style="padding:11px 12px"><div style="display:flex;align-items:center;gap:6px"><i class="ti ti-file-type-pdf" style="font-size:13px;color:${O}"></i><span style="font-size:13px;color:${TX}">${d.name}</span></div></td><td style="padding:11px 12px;font-size:12px;color:${MU};white-space:nowrap">${fDt(d.uploaded_at)}</td><td style="padding:11px 12px;font-size:12px;color:${MU}">${fSz(d.size||0)}</td><td style="padding:11px 12px"><div style="display:flex;gap:7px"><button onclick="oV('${d.id}')" class="bg" style="padding:4px 10px;font-size:12px">Ver</button><button onclick="ddD('${d.id}','${d.storage_path}')" class="bd" style="padding:4px 10px;font-size:12px">Excluir</button></div></td></tr>`}).join('')
    ct=`<div class="si"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><h2 style="font-family:${FD};font-weight:700;font-size:28px;color:${TX}">Documentos</h2><select onchange="A.fC=this.value;R()" style="width:auto;padding:7px 12px"><option value="all" ${A.fC==='all'?'selected':''}>Todos</option>${A.emps.map(e=>`<option value="${e.cpf}" ${A.fC===e.cpf?'selected':''}>${e.name}</option>`).join('')}</select></div><div style="background:${S2};border:1px solid ${BR};border-radius:12px;overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:1px solid ${BR};background:${S3}">${['Colaborador','Documento','Data','Tamanho','Ações'].map(h=>`<th style="font-size:11px;font-weight:600;color:${MU};text-align:left;padding:9px 12px;letter-spacing:1px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`
  }

  if(A.aT==='employees'){
    const eR=A.emps.map(e=>`<tr style="border-bottom:1px solid ${S4}" onmouseover="this.style.background='${S3}'" onmouseout="this.style.background='transparent'"><td style="padding:11px 16px"><div style="display:flex;align-items:center;gap:9px">${av(e.name,32)}<div><div style="font-size:13px;color:${TX};font-weight:500">${e.name}</div><div style="font-size:12px;color:${MU}">${fC(e.cpf)}</div></div></div></td><td style="padding:11px 16px"><span style="background:${S4};color:${O};font-size:12px;padding:3px 9px;border-radius:20px;font-weight:600">${A.docs.filter(d=>d.user_cpf===e.cpf).length} doc${A.docs.filter(d=>d.user_cpf===e.cpf).length!==1?'s':''}</span></td><td style="padding:11px 16px"><div style="display:flex;gap:10px;align-items:center"><button onclick="A.fC='${e.cpf}';A.aT='docs';R()" style="background:transparent;color:${O};font-size:12px;font-weight:500">Ver docs →</button><button onclick="mRst('${e.cpf}','${e.name.replace(/'/g,"\\'")}') " class="bg" style="padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:3px"><i class="ti ti-key" style="font-size:12px"></i>Redefinir</button></div></td></tr>`).join('')
    ct=`<div class="si"><h2 style="font-family:${FD};font-weight:700;font-size:28px;color:${TX};margin-bottom:20px">Colaboradores</h2>
    <div style="background:${S2};border:1px solid ${BR};border-radius:12px;padding:20px;margin-bottom:22px">
      <h3 style="font-family:${FD};font-size:19px;color:${TX};margin-bottom:13px;display:flex;align-items:center;gap:7px"><i class="ti ti-user-plus" style="font-size:17px;color:${O}"></i>Adicionar Colaborador</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:11px;align-items:flex-end">
        <div><label class="fl">CPF</label><input id="nCP" placeholder="000.000.000-00" oninput="this.value=fC(this.value)"></div>
        <div><label class="fl">Nome</label><input id="nNm" placeholder="Nome completo"></div>
        <div><label class="fl">Senha inicial</label><input id="nPw" type="password" placeholder="Mínimo 8 caracteres"></div>
        <button id="addBtn" onclick="aEm()" class="bp" style="padding:10px 18px;white-space:nowrap"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:3px"></i>Adicionar</button>
      </div>
    </div>
    <div style="background:${S2};border:1px solid ${BR};border-radius:12px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:1px solid ${BR};background:${S3}">${['Colaborador','Docs',''].map(h=>`<th style="font-size:11px;font-weight:600;color:${MU};text-align:left;padding:9px 16px;letter-spacing:1px;text-transform:uppercase">${h}</th>`).join('')}</tr></thead><tbody>${eR||`<tr><td colspan="3" style="padding:32px;text-align:center;color:${MU}">Nenhum colaborador. Adicione o primeiro acima.</td></tr>`}</tbody></table>
    </div></div>`
  }

  if(A.aT==='upload'){
    const eO=A.emps.map(e=>`<option value="${e.cpf}">${e.name} — ${fC(e.cpf)}</option>`).join('')
    ct=`<div class="si" style="max-width:500px"><h2 style="font-family:${FD};font-weight:700;font-size:28px;color:${TX};margin-bottom:20px">Enviar Documento</h2>
    <div style="background:${S2};border:1px solid ${BR};border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:17px">
      <div><label class="fl">Colaborador</label><select id="uE"><option value="">Selecione o colaborador</option>${eO}</select></div>
      <div><label class="fl">Nome do Documento</label><input id="uN" placeholder="Ex: Holerite Abril 2025"></div>
      <div><label class="fl">Arquivo PDF</label>
        <label id="dA" style="display:block;background:${S3};border:2px dashed ${BR};border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor='${O}'" onmouseout="this.style.borderColor='${BR}'">
          <input type="file" id="uF" accept=".pdf,application/pdf" style="display:none" onchange="uDr(this)">
          <div id="dL"><i class="ti ti-cloud-upload" style="font-size:28px;color:${MU};display:block;margin-bottom:7px"></i><div style="font-size:13px;color:${MU}">Clique para selecionar um PDF</div><div style="font-size:11px;color:#333;margin-top:3px">Tamanho máximo: 50 MB</div></div>
        </label>
      </div>
      <button id="uB" onclick="upld()" class="bp" style="padding:13px;font-size:15px;width:100%"><i class="ti ti-send" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>Enviar Documento</button>
    </div></div>`
  }

  return `<div style="height:100vh;display:flex;flex-direction:column;background:${BK}">
    ${nv()}
    <div style="background:${S1};border-bottom:1px solid ${BR};display:flex;padding:0 40px">
      ${tabs.map(([id,lb,ic])=>`<button onclick="A.aT='${id}';R()" class="nt ${A.aT===id?'on':''}"><i class="ti ${ic}" style="font-size:14px"></i>${lb}</button>`).join('')}
    </div>
    <div style="flex:1;overflow:auto;padding:30px 40px"><div style="max-width:980px;margin:0 auto">${ct}</div></div>
  </div>`
}

// ════════════════════════════════════════════════
//  MODAL: Redefinir senha (admin)
// ════════════════════════════════════════════════
function mRst(cpf,name){
  document.getElementById('modal').innerHTML=`<div class="mo" onclick="if(event.target===this)cMo()">
    <div style="background:${S2};border:1px solid ${BR};border-radius:14px;padding:28px;width:100%;max-width:380px;animation:fU .25s ease">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><h3 style="font-family:${FD};font-size:21px;font-weight:700;color:${TX}">Redefinir Senha</h3><button onclick="cMo()" style="background:transparent;color:${MU};font-size:22px;line-height:1;padding:0 4px">×</button></div>
      <div style="display:flex;align-items:center;gap:9px;background:${S3};border-radius:8px;padding:11px;margin-bottom:16px">${av(name,34)}<div><div style="font-size:13px;color:${TX};font-weight:500">${name}</div><div style="font-size:12px;color:${MU}">${fC(cpf)}</div></div></div>
      <div style="display:flex;flex-direction:column;gap:13px">
        <div><label class="fl">Nova senha</label><input id="mp1" type="password" placeholder="Mínimo 8 caracteres"></div>
        <div><label class="fl">Confirmar</label><input id="mp2" type="password" onkeydown="if(event.key==='Enter')dRs('${cpf}')"></div>
        <div id="mE" style="font-size:13px;color:${DG};display:none"></div>
        <button id="mBtn" onclick="dRs('${cpf}')" class="bp" style="padding:11px;font-size:14px;width:100%"><i class="ti ti-key" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Redefinir</button>
      </div>
    </div>
  </div>`
}

// ════════════════════════════════════════════════
//  OPERAÇÕES SUPABASE
// ════════════════════════════════════════════════

async function dL(){
  const cpf=rC(document.getElementById('lc')?.value||'')
  const pw=document.getElementById('lp')?.value||''
  const er=document.getElementById('le'),btn=document.getElementById('lbtn')
  er.style.display='none'
  if(cpf.length!==11||!pw){er.style.display='block';er.textContent='Preencha CPF e senha.';return}
  btn.textContent='Verificando...';btn.disabled=true
  const {data,error}=await sb.rpc('doxis_login',{p_cpf:cpf,p_password:pw})
  if(error||!data){er.style.display='block';er.textContent='CPF ou senha inválidos.';btn.textContent='Entrar';btn.disabled=false;return}
  A.profile=data
  saveSession(data)
  await sb.rpc('doxis_log',{p_cpf:cpf,p_action:'login'}).catch(()=>{})
  if(data.role==='admin'){A.v='admin';await loadAdminData()}
  else{A.v='dashboard';await loadMyDocs()}
  R()
}

async function lo(){
  if(A.profile)await sb.rpc('doxis_log',{p_cpf:A.profile.cpf,p_action:'logout'}).catch(()=>{})
  clearSession()
  A={v:'login',profile:null,docs:[],emps:[],aT:'overview',fC:'all',sd:null,bUrl:null}
  R()
}

async function loadMyDocs(){
  const{data}=await sb.from('documents').select('*').eq('user_cpf',A.profile.cpf).order('uploaded_at',{ascending:false})
  A.docs=data||[]
}

async function loadAdminData(){
  const[dr,er]=await Promise.all([
    sb.from('documents').select('*').order('uploaded_at',{ascending:false}),
    sb.from('profiles').select('id,cpf,name,role,active,created_at').eq('role','employee').eq('active',true).order('name')
  ])
  A.docs=dr.data||[];A.emps=er.data||[]
}

async function oV(id){
  const doc=A.docs.find(d=>d.id===id);if(!doc)return
  const{data,error}=await sb.storage.from('documentos').createSignedUrl(doc.storage_path,3600)
  if(error){tos('Erro ao abrir o documento. Verifique se o arquivo ainda existe.','err');return}
  await sb.rpc('doxis_log',{p_cpf:A.profile.cpf,p_action:'visualizou',p_doc_id:id}).catch(()=>{})
  A.bUrl=data.signedUrl;A.sd=doc;A.v='viewer';R()
}

async function dlD(id){
  const doc=A.docs.find(d=>d.id===id);if(!doc)return
  const{data,error}=await sb.storage.from('documentos').createSignedUrl(doc.storage_path,300)
  if(error){tos('Erro ao gerar link de download.','err');return}
  await sb.rpc('doxis_log',{p_cpf:A.profile.cpf,p_action:'baixou',p_doc_id:id}).catch(()=>{})
  const a=document.createElement('a');a.href=data.signedUrl;a.download=doc.name+'.pdf';a.click()
}

async function ddD(id,path){
  if(!confirm('Excluir este documento permanentemente? Esta ação não pode ser desfeita.'))return
  await sb.storage.from('documentos').remove([path])
  await sb.from('documents').delete().eq('id',id)
  A.docs=A.docs.filter(d=>d.id!==id)
  tos('Documento excluído.');R()
}

function uDr(inp){
  const el=document.getElementById('dL'),ar=document.getElementById('dA')
  if(inp.files[0]){el.innerHTML=`<i class="ti ti-file-check" style="font-size:28px;color:${O};display:block;margin-bottom:7px"></i><div style="font-size:14px;color:${O};font-weight:600">${inp.files[0].name}</div><div style="font-size:12px;color:${MU};margin-top:3px">${fSz(inp.files[0].size)}</div>`;ar.style.borderColor=O}
}

async function upld(){
  const emp=document.getElementById('uE')?.value
  const nm=document.getElementById('uN')?.value?.trim()
  const fl=document.getElementById('uF')?.files[0]
  if(!emp||!nm||!fl){tos('Preencha todos os campos.','err');return}
  const btn=document.getElementById('uB');btn.textContent='Enviando...';btn.disabled=true
  const path=`${emp}/${Date.now()}_${fl.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`
  const{error:upErr}=await sb.storage.from('documentos').upload(path,fl,{contentType:'application/pdf',upsert:false})
  if(upErr){tos('Erro no upload: '+upErr.message,'err');btn.textContent='Enviar Documento';btn.disabled=false;return}
  const{error:inErr}=await sb.from('documents').insert({user_cpf:emp,name:nm,storage_path:path,size:fl.size,uploaded_by:A.profile.id})
  if(inErr){tos('Erro ao salvar: '+inErr.message,'err');btn.textContent='Enviar Documento';btn.disabled=false;return}
  tos('Documento enviado com sucesso!')
  await loadAdminData();A.aT='overview';R()
}

async function aEm(){
  const cpf=rC(document.getElementById('nCP')?.value||'')
  const name=document.getElementById('nNm')?.value?.trim()
  const pw=document.getElementById('nPw')?.value
  if(!cpf||cpf.length!==11||!name||!pw||pw.length<8){tos('Verifique os campos. CPF com 11 dígitos e senha mínimo 8 caracteres.','err');return}
  const btn=document.getElementById('addBtn');btn.textContent='Criando...';btn.disabled=true
  const{data,error}=await sb.rpc('doxis_create_employee',{p_cpf:cpf,p_name:name,p_password:pw})
  if(error||data?.error){tos(data?.error||'Erro ao criar colaborador.','err');btn.textContent='Adicionar';btn.disabled=false;return}
  tos('Colaborador adicionado com sucesso!')
  document.getElementById('nCP').value='';document.getElementById('nNm').value='';document.getElementById('nPw').value=''
  await loadAdminData();R()
}

async function chP(){
  const cur=document.getElementById('pc')?.value
  const n1=document.getElementById('p1')?.value
  const n2=document.getElementById('p2')?.value
  const er=document.getElementById('pEr'),ok=document.getElementById('pOk')
  er.style.display='none';ok.style.display='none'
  if(!cur||!n1||!n2){er.style.display='block';er.textContent='Preencha todos os campos.';return}
  if(n1.length<8){er.style.display='block';er.textContent='Nova senha: mínimo 8 caracteres.';return}
  if(n1!==n2){er.style.display='block';er.textContent='As novas senhas não coincidem.';return}
  const btn=document.getElementById('chpBtn');btn.textContent='Salvando...';btn.disabled=true
  const{data,error}=await sb.rpc('doxis_change_password',{p_cpf:A.profile.cpf,p_old_password:cur,p_new_password:n1})
  btn.textContent='Salvar Nova Senha';btn.disabled=false
  if(error||data?.error){er.style.display='block';er.textContent=data?.error||'Erro ao alterar senha.';return}
  document.getElementById('pc').value='';document.getElementById('p1').value='';document.getElementById('p2').value=''
  ok.style.display='block';ok.textContent='Senha alterada com sucesso!';tos('Senha alterada!')
}

async function dRs(cpf){
  const p1=document.getElementById('mp1')?.value
  const p2=document.getElementById('mp2')?.value
  const er=document.getElementById('mE'),btn=document.getElementById('mBtn')
  er.style.display='none'
  if(!p1||p1.length<8){er.style.display='block';er.textContent='Mínimo 8 caracteres.';return}
  if(p1!==p2){er.style.display='block';er.textContent='Senhas não coincidem.';return}
  btn.textContent='Salvando...';btn.disabled=true
  const{data,error}=await sb.rpc('doxis_admin_reset_password',{p_admin_cpf:A.profile.cpf,p_target_cpf:cpf,p_new_password:p1})
  if(error||data?.error){er.style.display='block';er.textContent=data?.error||'Erro ao redefinir.';btn.textContent='Redefinir';btn.disabled=false;return}
  cMo();tos('Senha redefinida com sucesso!')
}

// ════════════════════════════════════════════════
//  RENDER + INIT
// ════════════════════════════════════════════════
function R(){
  const app=document.getElementById('app')
  if(A.v==='loading')app.innerHTML=vLoad()
  else if(A.v==='login')app.innerHTML=vLg()
  else if(A.v==='dashboard')app.innerHTML=vDs()
  else if(A.v==='viewer')app.innerHTML=vVw()
  else if(A.v==='profile')app.innerHTML=vPf()
  else if(A.v==='admin')app.innerHTML=vAd()
}

async function init(){
  R() // mostra loading
  // Verifica sessão salva
  const session=loadSession()
  if(session){
    A.profile=session
    try{
      if(session.role==='admin'){A.v='admin';await loadAdminData()}
      else{A.v='dashboard';await loadMyDocs()}
    }catch(e){clearSession();A.v='login'}
  }else{
    A.v='login'
  }
  R()
}

init()
</script>
</body>
</html>
