name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  postgres-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: doxis-test-only
          POSTGRES_DB: doxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: doxis-test-only
      PGDATABASE: doxis_test
    steps:
      - uses: actions/checkout@v4
      - name: Minimal isolated Supabase primitives
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610280001_doxis_v3.sql
      - name: Test row isolation and legacy Storage policy guard
        run: psql -v ON_ERROR_STOP=1 -f tests/security.sql
